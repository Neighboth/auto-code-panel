# Production compose file: pulls the image that GitHub Actions publishes to
# GHCR. Use `docker compose up -d --build` if you prefer building locally.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/neighboth/auto-code-panel:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SQLITE_PATH: /data/app.db
      AUTH_SECRET: ${AUTH_SECRET:-change-me-please-use-a-long-random-secret}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-change-me-please-use-a-long-random-secret}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin12345!}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-owner@example.com}
      BRAND_NAME: ${BRAND_NAME:-Nexora}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-Dijital hesap & kod teslimat altyapısı}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      RENEWAL_URL: ${RENEWAL_URL:-https://t.me/ornek_destek}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-destek@example.com}
      CRON_SECRET: ${CRON_SECRET:-change-me-cron-secret}
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  app-data:
