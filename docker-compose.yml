# Üretim compose dosyası.
#
# Tüm değerler doğrudan yazılıdır: `${DEGISKEN:-varsayilan}` kalıbı YOKTUR.
# Aşağıdaki değerleri kendi kurulumunuza göre düzenleyip
# `docker compose up -d` çalıştırmanız yeterlidir.
#
# İmaj GitHub Actions tarafından GHCR'ye gönderilir:
#   ghcr.io/neighboth/auto-code-panel:latest
# Yerelde derlemek isterseniz `docker compose up -d --build` kullanın.
services:
  app:
    image: ghcr.io/neighboth/auto-code-panel:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SQLITE_PATH: /data/app.db

      # --- Oturum ve şifreleme anahtarları (MUTLAKA DEĞİŞTİRİN) -----------
      AUTH_SECRET: degistirin-uzun-rastgele-bir-oturum-anahtari
      DATA_ENCRYPTION_KEY: degistirin-uzun-rastgele-bir-veri-anahtari

      # --- Platform sahibi (süper admin) ----------------------------------
      SUPER_ADMIN_USERNAME: admin
      SUPER_ADMIN_PASSWORD: Admin12345!
      SUPER_ADMIN_EMAIL: owner@example.com

      # --- Marka -----------------------------------------------------------
      BRAND_NAME: Pixelith
      BRAND_TAGLINE: Dijital hesap ve kod teslimat altyapisi
      BRAND_LOGO_URL: ""

      # --- Süre uzatma ve destek ------------------------------------------
      RENEWAL_URL: https://t.me/ornek_destek
      SUPPORT_EMAIL: destek@example.com
      CRON_SECRET: degistirin-uzun-rastgele-bir-cron-anahtari

      # --- Uygulamanın dış adresi (mail içindeki bağlantılar için) --------
      APP_URL: http://localhost:3000

      # --- SMTP (opsiyonel) ------------------------------------------------
      # Doldurulursa e-posta doğrulama, magic link ve bildirim mailleri aktif
      # olur. Boş bırakılırsa hiçbir mail gönderilmez ve kayıt akışı doğrulama
      # istemeden çalışmaya devam eder.
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMTP_FROM_NAME: Pixelith
      # auto | on | off  (auto: SMTP varsa açık)
      MAIL_VERIFICATION: auto
    volumes:
      - app-data:/data

volumes:
  app-data:
