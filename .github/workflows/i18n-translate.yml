name: i18n translate

# Machine-translates the UI dictionary into every supported locale.
#
# The sandbox that edits this repo cannot reach translation.googleapis.com, but
# a GitHub runner can, so the job runs here and commits the finished packs back
# onto the branch it was dispatched from (one commit per locale, so a timeout
# never loses work).
on:
  # The GitHub App that runs this session may not dispatch workflows (403), so a
  # push that touches this marker file is the way to start a job.
  push:
    branches: ["arena/**", "main"]
    paths: [".i18n/translate-request"]
  workflow_dispatch:
    inputs:
      locales:
        description: "Comma separated locale codes, or `all`"
        required: false
        default: all
      concurrency:
        description: "Parallel requests per locale"
        required: false
        default: "6"
      locales_parallel:
        description: "How many locales to translate at once"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: i18n-translate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Translate
        env:
          GITHUB_ACTIONS: "true"
          INPUT_LOCALES: ${{ inputs.locales }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_PARALLEL: ${{ inputs.locales_parallel }}
        run: |
          git config user.name "i18n-bot"
          git config user.email "i18n@users.noreply.github.com"
          set -o pipefail
          node scripts/i18n-translate.mjs \
            --locales="${INPUT_LOCALES:-all}" \
            --concurrency="${INPUT_CONCURRENCY:-6}" \
            --locales_parallel="${INPUT_PARALLEL:-4}" 2>&1 | tee /tmp/translate.log

      - name: Rebuild pack index
        run: node scripts/i18n-pack-index.mjs

      - name: Commit leftovers
        if: always()
        run: |
          mkdir -p .i18n
          cp /tmp/translate.log .i18n/last-run.log 2>/dev/null || echo "log yok" > .i18n/last-run.log
          tail -40 /tmp/translate.log >> .i18n/last-run.log 2>/dev/null || true
          git add -A src/lib/i18n/packs .i18n/last-run.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "i18n: çeviri paketleri (otomatik)" --no-verify
            git pull --rebase --autostash
            git push
          fi

      - name: Coverage report
        run: node scripts/i18n-coverage.mjs | head -12
